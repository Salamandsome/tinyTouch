# pcscd drop-in for the tinyTouch. Install as /etc/systemd/system/pcscd.service.d/tinytouch.conf.
# Points pcscd and libccid at a driver directory whose CCID driver knows the tinyTouch
# (303a:4001), written by linux/pcsc/make-driver-bundle.py.
[Service]
Environment=PCSCLITE_HP_DROPDIR=/etc/tinytouch/pcsc-drivers
